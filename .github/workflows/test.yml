name: Test

on:
  workflow_dispatch:
    inputs:
      kakoune_master:
        description: Test current Kakoune master and propose the verified pin
        type: boolean
        default: false
  schedule:
    - cron: '17 4 * * 1'
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Kakoune ${{ matrix.kakoune }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        kakoune:
          - packaged
          - v2026.05.21

    steps:
      - name: Check out vlang.kak
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install V 0.5.2
        env:
          V_ARCHIVE_SHA256: 86caf9e70c3342d48ef19eb4f6c47b709f18c90ae86255520d5c29df6b482e23
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/v_linux.zip" \
            https://github.com/vlang/v/releases/download/0.5.2/v_linux.zip
          echo "$V_ARCHIVE_SHA256  $RUNNER_TEMP/v_linux.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/v_linux.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/v" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/v/v" version

      - name: Install packaged Kakoune
        if: matrix.kakoune == 'packaged'
        run: |
          sudo apt-get update
          sudo apt-get install --yes kakoune
          echo "KAK=$(command -v kak)" >> "$GITHUB_ENV"

      - name: Build Kakoune ${{ matrix.kakoune }}
        if: matrix.kakoune != 'packaged'
        env:
          KAKOUNE_VERSION: ${{ matrix.kakoune }}
        run: |
          git clone --depth 1 --branch "$KAKOUNE_VERSION" \
            https://github.com/mawww/kakoune.git "$RUNNER_TEMP/kakoune"
          make -C "$RUNNER_TEMP/kakoune" -j2
          echo "KAK=$RUNNER_TEMP/kakoune/src/kak" >> "$GITHUB_ENV"
          echo "KAKOUNE_RUNTIME=$RUNNER_TEMP/kakoune/share/kak" >> "$GITHUB_ENV"

      - name: Install client-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes tmux

      - name: Run integration tests
        run: ./tests/run.sh

      - name: Check setup and update scripts
        run: |
          for script in scripts/*.sh; do sh -n "$script"; "$script" --help > /dev/null; done

  release:
    name: Managed installation and live VLS
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      kakoune_ref: ${{ steps.kakoune-master.outputs.revision }}
    steps:
      - name: Check out vlang.kak
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Install build and terminal dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential git curl unzip tmux python3 gdb \
            xvfb xauth screen xterm xdotool sway foot wtype libegl1 libgl1-mesa-dri libopengl0 libfontconfig1 \
            libxcursor1 libxrandr2 libxi6 libxinerama1 libxkbcommon0 \
            libxkbcommon-x11-0 libxcb-xkb1

      - name: Identify compiler cache
        id: compiler-cache
        run: |
          . tests/release.env
          echo "pins=$V_REF-$VC_REF" >> "$GITHUB_OUTPUT"
          echo "gcc=$(gcc -dumpfullversion)" >> "$GITHUB_OUTPUT"

      - name: Restore pinned compiler source and build
        id: compiler-restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /home/runner/.cache/vlang-kak-ci/v-toolchain/opt/vlang-v/releases
          key: v-ubuntu24-${{ runner.arch }}-${{ steps.compiler-cache.outputs.gcc }}-${{ steps.compiler-cache.outputs.pins }}-${{ hashFiles('scripts/install-v.sh') }}

      - name: Build or reuse the pinned V compiler
        env:
          COMPILER_CACHE_HIT: ${{ steps.compiler-restore.outputs.cache-hit }}
        run: |
          build_started=$(date +%s)
          ./scripts/install-v.sh "/home/runner/.cache/vlang-kak-ci/v-toolchain"
          echo "/home/runner/.cache/vlang-kak-ci/v-toolchain/opt/vlang-v/current" >> "$GITHUB_PATH"
          "/home/runner/.cache/vlang-kak-ci/v-toolchain/opt/vlang-v/current/v" version
          elapsed=$(( $(date +%s) - build_started ))
          if [ "$COMPILER_CACHE_HIT" = true ]; then cache_status=hit; else cache_status=miss; fi
          printf 'V compiler cache: %s; build/reuse: %s seconds\n' "$cache_status" "$elapsed" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Save the completed compiler build
        if: steps.compiler-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /home/runner/.cache/vlang-kak-ci/v-toolchain/opt/vlang-v/releases
          key: ${{ steps.compiler-restore.outputs.cache-primary-key }}

      - name: Resolve the weekly Kakoune master revision
        id: kakoune-master
        if: github.event_name == 'schedule' || inputs.kakoune_master == true
        run: |
          revision=$(git ls-remote https://github.com/mawww/kakoune.git refs/heads/master | awk '{print $1}')
          test "${#revision}" -eq 40
          echo "VLANG_RELEASE_KAKOUNE_REF=$revision" >> "$GITHUB_ENV"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Test clean installation, live navigation, debugging, panes, and updates
        run: |
          ./tests/release.sh "$RUNNER_TEMP/vlang-release" 2>&1 | tee "$RUNNER_TEMP/vlang-release.log"

      - name: Restore verified pane-host download archives
        id: pane-restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ runner.temp }}/vlang-pane-tools/zellij.tar.gz
            ${{ runner.temp }}/vlang-pane-tools/wezterm.tar.xz
            ${{ runner.temp }}/vlang-pane-tools/kitty.txz
          key: pane-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/pane-hosts.env') }}

      - name: Install pinned pane hosts for real-client checks
        run: |
          ./tests/install-pane-hosts.sh "$RUNNER_TEMP/vlang-pane-tools"
          echo "$RUNNER_TEMP/vlang-pane-tools/zellij" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/vlang-pane-tools/wezterm/wezterm/usr/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/vlang-pane-tools/kitty/bin" >> "$GITHUB_PATH"

      - name: Save verified pane-host archives
        if: steps.pane-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ runner.temp }}/vlang-pane-tools/zellij.tar.gz
            ${{ runner.temp }}/vlang-pane-tools/wezterm.tar.xz
            ${{ runner.temp }}/vlang-pane-tools/kitty.txz
          key: ${{ steps.pane-restore.outputs.cache-primary-key }}

      - name: Test real Zellij, WezTerm, kitty, Screen, Xterm and Wayland Foot clients
        run: |
          screen --version
          xterm -version
          foot --version
          sway --version
          for backend in zellij wezterm kitty screen native wayland; do
            python3 tests/pane_hosts.py "$RUNNER_TEMP/vlang-release/prefix" "$backend" \
              --artifacts "$RUNNER_TEMP/vlang-release/pane-hosts/$backend"
          done

      - name: Save release and acceptance logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-verification
          path: |
            ${{ runner.temp }}/vlang-release.log
            ${{ runner.temp }}/vlang-release/lsp/**/ui.jsonl
            ${{ runner.temp }}/vlang-release/lsp/**/editor-debug
            ${{ runner.temp }}/vlang-release/lsp/**/kak-stderr
            ${{ runner.temp }}/vlang-release/acceptance/lsp/**/ui.jsonl
            ${{ runner.temp }}/vlang-release/acceptance/lsp/**/editor-debug
            ${{ runner.temp }}/vlang-release/acceptance/lsp/**/kak-stderr
            ${{ runner.temp }}/vlang-release/acceptance/**/*.log
            ${{ runner.temp }}/vlang-release/acceptance/results.txt
            ${{ runner.temp }}/vlang-release/pane-hosts/**/host.log
            ${{ runner.temp }}/vlang-release/pane-hosts/**/kak-debug
            ${{ runner.temp }}/vlang-release/pane-hosts/**/panes.json
            ${{ runner.temp }}/vlang-release/pane-hosts/**/pane-*.txt
            ${{ runner.temp }}/vlang-release/pane-hosts/**/terminal-*.log
            ${{ runner.temp }}/vlang-release/pane-hosts/**/screen-terminal.txt
          if-no-files-found: ignore

  kakoune-update:
    name: Propose verified Kakoune master update
    timeout-minutes: 10
    needs: [test, release]
    if: github.event_name == 'schedule' || inputs.kakoune_master == true
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out vlang.kak
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Propose the verified Kakoune update
        env:
          GH_TOKEN: ${{ github.token }}
          VLANG_RELEASE_KAKOUNE_REF: ${{ needs.release.outputs.kakoune_ref }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path('tests/release.env')
          text = path.read_text()
          lines = text.splitlines()
          path.write_text('\n'.join('KAKOUNE_VERSION=' + os.environ['VLANG_RELEASE_KAKOUNE_REF']
                                    if line.startswith('KAKOUNE_VERSION=') else line
                                    for line in lines) + '\n')
          PY
          if git diff --quiet -- tests/release.env; then exit 0; fi
          branch="automation/kakoune-${VLANG_RELEASE_KAKOUNE_REF}"
          if gh pr list --head "$branch" --state all --json number --jq 'length' | grep -qv '^0$'; then exit 0; fi
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/release.env
          git commit -m "Test IDE against Kakoune ${VLANG_RELEASE_KAKOUNE_REF}"
          if ! git ls-remote --exit-code origin "refs/heads/$branch" >/dev/null; then
            git push origin "$branch"
          fi
          cat > "$RUNNER_TEMP/kakoune-update.md" <<EOF
          Weekly Kakoune master update to \`$VLANG_RELEASE_KAKOUNE_REF\`.

          The clean install, automated IDE acceptance pass, and managed update checks passed.
          Review the uploaded logs and merge to advance the release gate's Kakoune pin.
          User settings and installed editor sessions are unchanged.
          EOF
          gh pr create --base '${{ github.event.repository.default_branch }}' --head "$branch" \
            --title "Update verified Kakoune master revision" --body-file "$RUNNER_TEMP/kakoune-update.md"
