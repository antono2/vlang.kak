name: Test

on:
  workflow_dispatch:
    inputs:
      kakoune_master:
        description: Test current Kakoune master and propose the verified pin
        type: boolean
        default: false
  schedule:
    - cron: '17 4 * * 1'
  pull_request:
  push:
    paths-ignore: ['**/*.md']
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Kakoune ${{ matrix.kakoune }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        kakoune:
          - packaged
          - v2026.05.21

    steps:
      - name: Check out vlang.kak
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install V 0.5.2
        uses: ./.github/actions/setup-v

      - name: Install packaged Kakoune
        if: matrix.kakoune == 'packaged'
        run: |
          sudo apt-get update
          sudo apt-get install --yes kakoune

      - name: Select packaged Kakoune
        if: matrix.kakoune == 'packaged'
        run: v run tests/ci.vsh packaged-kakoune

      - name: Build Kakoune ${{ matrix.kakoune }}
        if: matrix.kakoune != 'packaged'
        env:
          KAKOUNE_VERSION: ${{ matrix.kakoune }}
        run: v run tests/ci.vsh build-kakoune "$KAKOUNE_VERSION" "$RUNNER_TEMP/managed-kakoune"

      - name: Install client-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes tmux

      - name: Run integration tests
        run: v run tests/run.vsh

      - name: Test the Kakoune proposal workflow with a local Git remote
        if: matrix.kakoune == 'packaged'
        run: v run tests/check_kakoune_proposal.vsh

      - name: Test V and VLS installation and activation with local source repositories
        if: matrix.kakoune == 'packaged'
        run: v run tests/ci.vsh installer-tests

      - name: Test installation diagnostics and compiler fallback
        if: matrix.kakoune == 'packaged'
        run: v run tests/check_diagnostics.vsh

      - name: Check setup and update scripts
        run: v run tests/ci.vsh shell-checks

  release:
    name: Managed installation and live VLS
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      kakoune_ref: ${{ steps.kakoune-master.outputs.revision }}
    steps:
      - name: Check out vlang.kak
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Install build and terminal dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential git curl unzip tmux gdb \
            xvfb xauth screen xterm xdotool sway foot wtype libegl1 libgl1-mesa-dri libopengl0 libfontconfig1 \
            libxcursor1 libxrandr2 libxi6 libxinerama1 libxkbcommon0 \
            libxkbcommon-x11-0 libxcb-xkb1 imagemagick fonts-dejavu-core

      - name: Install bootstrap V 0.5.2
        uses: ./.github/actions/setup-v

      - name: Identify compiler cache
        id: compiler-cache
        run: v run tests/ci.vsh compiler-cache

      - name: Restore pinned compiler source and build
        id: compiler-restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /home/runner/.cache/vlang-kak-ci/v-toolchain/opt/vlang-v/releases
          key: v-ubuntu24-${{ runner.arch }}-${{ steps.compiler-cache.outputs.gcc }}-${{ steps.compiler-cache.outputs.pins }}-${{ hashFiles('scripts/install-v.sh', 'scripts/install-v.vsh', 'scripts/install-v-posix') }}

      - name: Build or reuse the pinned V compiler
        env:
          COMPILER_CACHE_HIT: ${{ steps.compiler-restore.outputs.cache-hit }}
        run: v run tests/ci.vsh compiler "/home/runner/.cache/vlang-kak-ci/v-toolchain"

      - name: Save the completed compiler build
        if: steps.compiler-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /home/runner/.cache/vlang-kak-ci/v-toolchain/opt/vlang-v/releases
          key: ${{ steps.compiler-restore.outputs.cache-primary-key }}

      - name: Resolve the weekly Kakoune master revision
        id: kakoune-master
        if: github.event_name == 'schedule' || inputs.kakoune_master == true
        run: v run tests/ci.vsh kakoune-master

      - name: Test clean installation, live navigation, debugging, panes and updates
        run: v run tests/ci.vsh release "$RUNNER_TEMP/vlang-release" "$RUNNER_TEMP/vlang-release.log"

      - name: Record the six-screen IDE demonstration
        env:
          TMPDIR: ${{ runner.temp }}/vlang-release
        run: |
          v run tests/record_demo.vsh "$RUNNER_TEMP/vlang-release/prefix" \
            "$RUNNER_TEMP/vlang-release/demo/ide.gif" --frames "$RUNNER_TEMP/vlang-release/demo/frames"

      - name: Restore verified pane-host download archives
        id: pane-restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ runner.temp }}/vlang-pane-tools/zellij.tar.gz
            ${{ runner.temp }}/vlang-pane-tools/wezterm.tar.xz
            ${{ runner.temp }}/vlang-pane-tools/kitty.txz
          key: pane-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/pane-hosts.env') }}

      - name: Install pinned pane hosts for real-client checks
        run: v run tests/install-pane-hosts.vsh "$RUNNER_TEMP/vlang-pane-tools" --github-path "$GITHUB_PATH"

      - name: Save verified pane-host archives
        if: steps.pane-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ runner.temp }}/vlang-pane-tools/zellij.tar.gz
            ${{ runner.temp }}/vlang-pane-tools/wezterm.tar.xz
            ${{ runner.temp }}/vlang-pane-tools/kitty.txz
          key: ${{ steps.pane-restore.outputs.cache-primary-key }}

      - name: Test real Zellij, WezTerm, kitty, Screen, Xterm and Wayland Foot clients
        run: v run tests/ci.vsh pane-clients "$RUNNER_TEMP/vlang-release/prefix" "$RUNNER_TEMP/vlang-release/pane-hosts"

      - name: Save release and acceptance logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-verification
          path: |
            ${{ runner.temp }}/vlang-release.log
            ${{ runner.temp }}/vlang-release/lsp/**/ui.jsonl
            ${{ runner.temp }}/vlang-release/lsp/**/editor-debug
            ${{ runner.temp }}/vlang-release/lsp/**/kak-stderr
            ${{ runner.temp }}/vlang-release/acceptance/lsp/**/ui.jsonl
            ${{ runner.temp }}/vlang-release/acceptance/lsp/**/editor-debug
            ${{ runner.temp }}/vlang-release/acceptance/lsp/**/kak-stderr
            ${{ runner.temp }}/vlang-release/acceptance/**/*.log
            ${{ runner.temp }}/vlang-release/acceptance/results.txt
            ${{ runner.temp }}/vlang-release/demo/ide.gif
            ${{ runner.temp }}/vlang-release/demo/frames/*.png
            ${{ runner.temp }}/vlang-release/vlang-demo-*/last-screen.txt
            ${{ runner.temp }}/vlang-release/vlang-demo-*/*.ansi
            ${{ runner.temp }}/vlang-release/pane-hosts/**/host.log
            ${{ runner.temp }}/vlang-release/pane-hosts/**/kak-debug
            ${{ runner.temp }}/vlang-release/pane-hosts/**/panes.json
            ${{ runner.temp }}/vlang-release/pane-hosts/**/pane-*.txt
            ${{ runner.temp }}/vlang-release/pane-hosts/**/terminal-*.log
            ${{ runner.temp }}/vlang-release/pane-hosts/**/screen-terminal.txt
          if-no-files-found: ignore

  kakoune-update:
    name: Propose verified Kakoune master update
    timeout-minutes: 10
    needs: [test, release]
    if: github.event_name == 'schedule' || inputs.kakoune_master == true
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Check out vlang.kak
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install V 0.5.2
        uses: ./.github/actions/setup-v
      - name: Propose the verified Kakoune update
        env:
          GH_TOKEN: ${{ github.token }}
          VLANG_RELEASE_KAKOUNE_REF: ${{ needs.release.outputs.kakoune_ref }}
          VLANG_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: v run tests/propose-kakoune-update.vsh "$VLANG_RELEASE_KAKOUNE_REF" "$VLANG_DEFAULT_BRANCH"
